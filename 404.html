<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <title>أدواتي | My Tools</title>
  <script>
    // GitHub Pages SPA Redirect Trick
    // Encodes the path as a query string and redirects to index.html
    var l = window.location;
    l.replace(
      l.protocol + '//' + l.hostname + (l.port ? ':' + l.port : '') +
      '/?/' +
      l.pathname.slice(1).replace(/&/g, '~and~') +
      (l.search ? '&' + l.search.slice(1).replace(/&/g, '~and~') : '') +
      l.hash
    );
  </script>
</head>
<body>
  <p>جاري التحويل... Redirecting...</p>
</body>
</html>
